# ============================================================
#  docker compose -f deploy/docker-compose.yml up -d
#  پورت فقط روی لوکال باز می‌شود؛ nginx جلویش می‌نشیند.
# ============================================================
services:
  aiassist:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aiassist
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../docs:/app/docs
