# ============================================================
#  nginx — دستیار پشتیبانی هوشمند
#  aiassist.softmiliac.com  →  127.0.0.1:8000
#
#  نصب روی اوبونتو/دبیان:
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/aiassist
#    sudo ln -s /etc/nginx/sites-available/aiassist /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  گواهی HTTPS (بعد از اینکه دامنه به سرور اشاره کرد):
#    sudo certbot --nginx -d aiassist.softmiliac.com
#  certbot خودش بلوک ۴۴۳ و ریدایرکت را اضافه می‌کند.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name aiassist.softmiliac.com;

    # certbot برای صدور و تمدید گواهی به این مسیر نیاز دارد
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiassist.softmiliac.com;

    # این چهار خط را certbot خودش پر می‌کند
    # ssl_certificate     /etc/letsencrypt/live/aiassist.softmiliac.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aiassist.softmiliac.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- سرآیندهای امنیتی ---
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "SAMEORIGIN"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000"  always;

    # --- آپلود فایل راهنما ---
    # MAX_UPLOAD_MB در .env روی ۶۰ است؛ اینجا کمی بیشتر می‌گذاریم
    client_max_body_size 80M;

    # --- لاگ ---
    access_log /var/log/nginx/aiassist.access.log;
    error_log  /var/log/nginx/aiassist.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── مهم: پاسخ‌ها به صورت استریم می‌آیند (SSE).
        # اگر بافرینگ روشن بماند، کاربر تا آخرِ کارِ مدل هیچ چیزی نمی‌بیند
        # و بعد یکجا کل متن ظاهر می‌شود.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # ── مهم: بارگذاری یک PDF صد صفحه‌ای با خواندن اسکرین‌شات‌ها
        # می‌تواند چند دقیقه طول بکشد. تایم‌اوت پیش‌فرض ۶۰ ثانیه کافی نیست.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # فایل‌های ثابت (CSS، JS، فونت) را طولانی کش کن
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
