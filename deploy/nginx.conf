# ============================================================
#  nginx — دستیار پشتیبانی هوشمند
#  aiassist.softmiliac.com  →  127.0.0.1:8000
#
#  نصب روی اوبونتو/دبیان:
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/aiassist
#    sudo ln -s /etc/nginx/sites-available/aiassist /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  سپس گواهی HTTPS:
#    sudo certbot --nginx -d aiassist.softmiliac.com
#
#  ⚠️ این فایل عمداً فقط HTTP دارد.
#  اگر بلوک 443 را از قبل بنویسیم، تا وقتی گواهی صادر نشده
#  «nginx -t» با خطای no "ssl_certificate" is defined رد می‌شود و
#  اصلاً نمی‌شود nginx را بالا آورد تا certbot گواهی بگیرد.
#  certbot خودش بعد از صدور گواهی، بلوک 443 و ریدایرکت را به همین
#  فایل اضافه می‌کند — تنظیمات پایین عیناً به بلوک HTTPS منتقل می‌شوند.
# ============================================================

server {
    listen 80;
    # اگر سرور IPv6 دارد، این خط را از حالت توضیح دربیاورید.
    # روی سرورهایی که IPv6 خاموش است، وجودش باعث می‌شود nginx اصلاً بالا نیاید:
    #   [emerg] socket() [::]:80 failed (97: Address family not supported by protocol)
    # listen [::]:80;
    server_name aiassist.softmiliac.com;

    # --- سرآیندهای امنیتی ---
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- آپلود فایل راهنما ---
    # MAX_UPLOAD_MB در .env روی ۶۰ است؛ اینجا کمی بیشتر می‌گذاریم
    client_max_body_size 80M;

    access_log /var/log/nginx/aiassist.access.log;
    error_log  /var/log/nginx/aiassist.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── مهم: پاسخ‌ها به صورت استریم می‌آیند (SSE).
        # اگر بافرینگ روشن بماند، کاربر تا آخرِ کارِ مدل هیچ چیزی نمی‌بیند
        # و بعد یکجا کل متن ظاهر می‌شود.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # ── مهم: بارگذاری یک PDF صد صفحه‌ای با خواندن اسکرین‌شات‌ها
        # می‌تواند چند دقیقه طول بکشد. تایم‌اوت پیش‌فرض ۶۰ ثانیه کافی نیست.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # فایل‌های ثابت (CSS، JS، فونت) را طولانی کش کن
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
